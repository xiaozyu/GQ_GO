<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 圓形背景漸層：沉穩的深鐵灰色 -->
    <linearGradient id="circleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222b38"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- 閃電專屬金屬立體光澤漸層 -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- 立體懸浮陰影 -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- iOS 完美圓角 App 外框 -->
  <rect width="512" height="512" rx="116" ry="116" fill="#0b0f19"/>

  <!-- 主體大圓形背景（帶立體陰影） -->
  <circle cx="256" cy="256" r="200" fill="url(#circleBg)" stroke="#334155" stroke-width="6" filter="url(#dropShadow)"/>

  <!-- 亮眼立體閃電符號（中心視覺） -->
  <path d="M280 60 L130 260 H230 L210 452 L382 220 H270 Z" fill="url(#boltGrad)" filter="url(#boltGlow)"/>
  
  <!-- 閃電高光描邊，增加立體質感 -->
  <path d="M280 60 L130 260 H230 L210 452 L382 220 H270 Z" fill="none" stroke="#fef08a" stroke-width="3" opacity="0.6"/>
</svg>
