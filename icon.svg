<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景漸層：深色科技感 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- 導航線條光暈 -->
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- 立體陰影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 圓角主體外框 -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- 內側精緻裝飾環 -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2"/>

  <!-- 地圖網格與抽象路網 -->
  <g opacity="0.18">
    <path d="M0 128 L512 128 M0 256 L512 256 M0 384 L512 384 M128 0 L128 512 M256 0 L256 512 M384 0 L384 512" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- 流暢導航路線軌跡 -->
  <path d="M 130 380 Q 200 360, 240 260 T 382 140" fill="none" stroke="url(#pathGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 130 380 Q 200 360, 240 260 T 382 140" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- 點 A：目前位置 (藍色光暈圓點) -->
  <g transform="translate(130, 380)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="26" fill="#1d4ed8" opacity="0.4"/>
    <circle cx="0" cy="0" r="18" fill="#2563eb" stroke="#ffffff" stroke-width="4"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
  </g>

  <!-- 點 B：中繼電杆／設施 (黃色標記) -->
  <g transform="translate(240, 260)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="28" fill="#ca8a04" opacity="0.4"/>
    <circle cx="0" cy="0" r="20" fill="#eab308" stroke="#ffffff" stroke-width="4"/>
    <text x="0" y="7" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">⚡</text>
  </g>

  <!-- 點 C：目標案件 (高質感紅色大定位針) -->
  <g transform="translate(382, 140)" filter="url(#shadow)">
    <path d="M0 -34 C-16 -34 -28 -20 -28 -4 C-28 14, 0 42, 0 42 C0 42, 28 14, 28 -4 C28 -20, 16 -34, 0 -34 Z" fill="#dc2626" stroke="#ffffff" stroke-width="5"/>
    <circle cx="0" cy="-6" r="8" fill="#ffffff"/>
  </g>
  
  <!-- 品牌文字裝飾 GQ -->
  <text x="256" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#38bdf8" letter-spacing="4" text-anchor="middle" opacity="0.9">GQ_GO</text>
</svg>
